[project]
name = "sshpc-evaluation"
version = "1.0.0"
description = "SSHPC Evaluation: Statistical Analysis & Figures for Self-Surprisal Hard Prompt Compression"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "pandas==3.0.6",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "loguru==0.7.3",
    "psutil==7.2.2",
    "jsonschema==4.26.0",
    "tqdm==4.70.1",
    "transformers==4.40.2",
    "datasets==5.0.1",
    "huggingface_hub==0.36.2",
    "safetensors==0.8.0",
    "tokenizers==0.19.1",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "torchaudio==2.5.1",
    "accelerate==1.6.0",
    "rouge-score==0.1.2",
    "evaluate==0.4.4",
    "scikit-learn==1.9.1",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
pip-compile-extra = ["cpu"]